# Canonical lab and notebook registry. This file, not filename order, is the source of truth for the 13 labs.
# Each lab is a script (--mode local|cai) and a notebook template. Group copies of the templates are generated
# under workshop/runtime/groups/<group_id>/notebooks/ by scripts/prepare_group_workspaces.py.
schema_version: 1
labs:
  - id: "00"
    key: environment_validation
    title: Environment Validation
    audience: [trainer, participant]
    trainer_only: false
    script: scripts/00_environment_validation.py
    notebook: notebooks/templates/00_environment_validation.ipynb
    legacy_scripts: [scripts/00_environment_check.py]
    purpose: Validate Python 3.10, the runtime, your group configuration, the dataset, and the service variables.
    theory: >-
      Before any lab runs, confirm that the environment is what the workshop expects. A mismatch found here costs
      seconds; the same mismatch found in lab 08 costs a debugging session. Your group, dataset bundle and mission
      come from group.env, and every lab reuses the same resolver.
    expected: Python 3.10 passes; your GROUP_ID, DATASET_ID, MISSION_ID and workspace are shown; the dataset validates; GPU steps are SKIPPED locally.
  - id: "01"
    key: model_artifact_validation
    title: Model Artifact Validation
    audience: [trainer]
    trainer_only: true
    script: scripts/01_model_artifact_validation.py
    notebook: notebooks/templates/01_model_artifact_validation.ipynb
    legacy_scripts: [scripts/01_model_download.py]
    purpose: Validate the Qwen model directory on the CAI NFS workspace without downloading anything by default.
    theory: >-
      The model weights live on shared NFS and are never packaged or downloaded by a notebook. This lab only checks
      that the directory is complete (config and safetensors files) and can record checksums. A download exists only
      as an explicit, trainer-only command-line flag.
    expected: In CAI the model directory validates; locally a synthetic stand-in directory is checked and the NFS step is SKIPPED.
  - id: "02"
    key: vllm_deployment
    title: vLLM Deployment
    audience: [trainer]
    trainer_only: true
    script: scripts/02_vllm_deployment.py
    notebook: notebooks/templates/02_vllm_deployment.ipynb
    legacy_scripts: [scripts/02_vllm_server.py]
    purpose: Preview and validate the single shared vLLM deployment. Trainer demo only.
    theory: >-
      One shared vLLM endpoint serves all ten groups on one GPU (tensor parallel size 1, bfloat16). The trainer
      starts it as a CAI Application. Participants read this lab to understand the settings; they never start a model
      server themselves.
    expected: The launch command is previewed and checked (TP=1, bfloat16, loopback binding); starting vLLM is SKIPPED unless the trainer explicitly enables it.
  - id: "03"
    key: llm_api_testing
    title: LLM API Testing
    audience: [participant]
    trainer_only: false
    script: scripts/03_llm_api_testing.py
    notebook: notebooks/templates/03_llm_api_testing.ipynb
    legacy_scripts: []
    purpose: Test the shared endpoint - health, models, a normal request and a streaming request.
    theory: >-
      The shared model speaks the OpenAI-compatible API. A health check proves the server is up, the models list proves
      the right model is served, and streaming shows tokens as they are produced. Your requests share the endpoint
      with nine other groups, so keep them small.
    expected: health, models, non-streaming chat and streaming chat all PASS (against a mock locally).
  - id: "04"
    key: csv_data_access
    title: CSV Data Access
    audience: [participant]
    trainer_only: false
    script: scripts/04_csv_data_access.py
    notebook: notebooks/templates/04_csv_data_access.ipynb
    legacy_scripts: []
    purpose: Explore your group's assigned logical bundle of the synthetic banking dataset.
    theory: >-
      One physical dataset in data/raw serves all ten groups; your bundle lists the tables you may read. Queries are
      read-only and limited to those tables. CSV is the default backend; Impala is an optional trainer demonstration.
    expected: Row counts and previews for each table in your bundle; a table outside your bundle is refused with a friendly message.
  - id: "05"
    key: semantic_layer
    title: Semantic Layer
    audience: [participant]
    trainer_only: false
    script: scripts/05_semantic_layer.py
    notebook: notebooks/templates/05_semantic_layer.ipynb
    legacy_scripts: [scripts/06_semantic_layer.py]
    purpose: Understand the data dictionary, relationships, metrics and business terms behind your mission.
    theory: >-
      Business questions use words like "dormant account"; the semantic layer turns each into one metric and a safe
      SQL statement. Joins follow many-to-one links toward parent tables, so a breakdown never double counts rows.
    expected: Your mission's sample questions compile to SQL and return rows; a breakdown outside your bundle is refused.
  - id: "06"
    key: crewai_tools
    title: CrewAI Tools
    audience: [participant]
    trainer_only: false
    script: scripts/06_crewai_tools.py
    notebook: notebooks/templates/06_crewai_tools.ipynb
    legacy_scripts: []
    purpose: Build and test a group-scoped banking data tool that an agent can call.
    theory: >-
      An agent can only act through the tools you give it. The tool here wraps your group's data bundle, so the agent
      can never reach another group's tables, and refusals come back as plain sentences instead of crashes.
    expected: The tool answers your first sample question, refuses an out-of-bundle request politely, and rejects another group's identity.
  - id: "07"
    key: qdrant_rag
    title: Qdrant RAG
    audience: [participant]
    trainer_only: false
    script: scripts/07_qdrant_rag.py
    notebook: notebooks/templates/07_qdrant_rag.ipynb
    legacy_scripts: [scripts/07_rag_with_qdrant.py]
    purpose: Index and retrieve glossary and mission notes with a mandatory group_id filter.
    theory: >-
      Retrieval-augmented generation looks up relevant text before answering. All groups share one Qdrant collection,
      so every query carries a group_id filter and every returned point is re-checked against it.
    expected: Your documents are indexed and retrieved; every hit carries your group_id; locally this uses an in-memory store.
  - id: "08"
    key: agent_workflow
    title: Multi-Agent Workflow
    audience: [participant]
    trainer_only: false
    script: scripts/08_agent_workflow.py
    notebook: notebooks/templates/08_agent_workflow.ipynb
    legacy_scripts: [scripts/08_multi_agent_workflow.py]
    purpose: Run a lightweight CrewAI workflow with the shared LLM and your group's data tool.
    theory: >-
      Two small agents cooperate: an analyst calls the data tool, and a writer explains the result without changing
      the numbers. The same workflow also runs as plain code so you can compare. Locally the model is an explicit mock.
    expected: The data tool is called, a final answer is produced, and the grounding check passes.
  - id: "09"
    key: phoenix_monitoring
    title: Phoenix Monitoring
    audience: [participant, trainer]
    trainer_only: false
    script: scripts/09_phoenix_monitoring.py
    notebook: notebooks/templates/09_phoenix_monitoring.ipynb
    legacy_scripts: [scripts/09_phoenix_observability.py]
    purpose: Send traces that carry group and session metadata and check them.
    theory: >-
      A trace is a timeline of what an agent did. Every span here carries your group_id, session id, dataset_id and
      mission_id, so one shared Phoenix can show each group's work without mixing it up. Secrets are filtered out.
    expected: Spans exist with the four identifiers and no secret; in CAI they also appear in the shared Phoenix.
  - id: "10"
    key: litellm_routing
    title: LiteLLM Routing
    audience: [participant, trainer]
    trainer_only: false
    script: scripts/10_litellm_routing.py
    notebook: notebooks/templates/10_litellm_routing.ipynb
    legacy_scripts: []
    purpose: Route requests through LiteLLM and see how retry and endpoint fallback behave.
    theory: >-
      LiteLLM is a gateway in front of the model. It retries a failing endpoint and can fall back to a controlled
      workshop endpoint. The local demonstration simulates a failing primary; the trainer shows the real gateway.
    expected: The routing configuration is valid and the simulated failure ends on the fallback route.
  - id: "11"
    key: guardrails
    title: Input and Output Guardrails
    audience: [participant]
    trainer_only: false
    script: scripts/11_guardrails.py
    notebook: notebooks/templates/11_guardrails.ipynb
    legacy_scripts: [scripts/11_llm_guardrails.py]
    purpose: Validate inputs, SQL access and model outputs.
    theory: >-
      Guardrails are ordinary, readable code. Inputs are checked for prompt injection, SQL is limited to your
      bundle and to read-only statements, and numbers in an answer must come from the tool result.
    expected: Every unsafe example is rejected with a clear reason and every safe example is accepted.
  - id: "12"
    key: end_to_end_portal
    title: End-to-End Workshop Portal
    audience: [participant]
    trainer_only: false
    script: scripts/12_end_to_end_portal.py
    notebook: notebooks/templates/12_end_to_end_portal.ipynb
    legacy_scripts: []
    purpose: Validate the full group-specific workflow through the shared Workshop Portal.
    theory: >-
      The Portal combines everything: your mission, the data bundle, the shared model, retrieval, queueing and
      tracing. Your group is locked after the first question, and your answers are saved in your own workspace.
    expected: Locally an in-process Portal answers your first sample question; in CAI the Portal is reachable and your saved answer is found.
# rc1 scripts that keep their original behavior and paths. They are not part of the canonical sequence.
legacy_only:
  - {script: scripts/04_crewai_fundamentals.py, note: rc1 two-agent CrewAI example}
  - {script: scripts/05_impala_ask_data.py, note: optional trainer-controlled Impala or rc1 CSV demonstration}
  - {script: scripts/12_agent_studio_client.py, note: Agent Studio reference client}
