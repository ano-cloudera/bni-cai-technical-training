# Workshop groups for the shared Workshop Portal (single_project topology).
# Operational isolation only, not a security boundary: every group reads the same fully synthetic data.
# Each group is assigned exactly one analytical scenario. Sample questions use the metrics and dimensions of
# the rc1 credit-portfolio semantic model until the single-project dataset lands, so some scenarios are
# stand-ins (noted in each description).
schema_version: 1
topology: single_project
datasets:
  credit_portfolio:
    title: Synthetic credit portfolio (rc1 dataset)
    csv_dir: data/csv
    semantic_model: semantic/credit_portfolio.yaml
    synthetic: true
scenarios:
  customer_portfolio_summary:
    title: Customer portfolio summary
    description: "Summarise the customer portfolio by segment."
    sample_questions: ["Show account count by customer segment", "Show outstanding balance by customer segment"]
  transaction_trends:
    title: Transaction trends
    description: "Explore activity trends (stand-in: product activity until the transaction table lands)."
    sample_questions: ["Show account count by product id", "Show outstanding balance by product id"]
  loan_portfolio_monitoring:
    title: Loan portfolio monitoring
    description: "Monitor delinquency across the loan portfolio."
    sample_questions: ["Show delinquency rate by risk band", "Show delinquency rate by region"]
  branch_performance:
    title: Branch performance
    description: "Compare branches by exposure and delinquency."
    sample_questions: ["Show outstanding balance by branch id", "Show delinquency rate by branch id"]
  dormant_accounts:
    title: Dormant accounts
    description: "Look for inactive accounts (stand-in: account counts by risk band)."
    sample_questions: ["Show account count by risk band", "Show account count by region"]
  unusual_transaction_patterns:
    title: Unusual transaction patterns
    description: "Look for unusual concentrations (stand-in: delinquency by region)."
    sample_questions: ["Show delinquency rate by region", "Show delinquency rate by customer segment"]
  customer_segmentation:
    title: Customer segmentation
    description: "Compare customer segments."
    sample_questions: ["Show account count by customer segment", "Show delinquency rate by customer segment"]
  product_adoption:
    title: Product adoption
    description: "See how products are used."
    sample_questions: ["Show account count by product id", "Show outstanding balance by product id"]
  regional_comparison:
    title: Regional comparison
    description: "Compare regions."
    sample_questions: ["Show outstanding balance by region", "Show delinquency rate by region"]
  management_summary:
    title: Management summary
    description: "Headline portfolio figures for management."
    sample_questions: ["Show outstanding balance", "Show delinquency rate", "Show account count"]
groups:
  - {group_id: group_01, scenarios: [customer_portfolio_summary], datasets: [credit_portfolio]}
  - {group_id: group_02, scenarios: [transaction_trends], datasets: [credit_portfolio]}
  - {group_id: group_03, scenarios: [loan_portfolio_monitoring], datasets: [credit_portfolio]}
  - {group_id: group_04, scenarios: [branch_performance], datasets: [credit_portfolio]}
  - {group_id: group_05, scenarios: [dormant_accounts], datasets: [credit_portfolio]}
  - {group_id: group_06, scenarios: [unusual_transaction_patterns], datasets: [credit_portfolio]}
  - {group_id: group_07, scenarios: [customer_segmentation], datasets: [credit_portfolio]}
  - {group_id: group_08, scenarios: [product_adoption], datasets: [credit_portfolio]}
  - {group_id: group_09, scenarios: [regional_comparison], datasets: [credit_portfolio]}
  - {group_id: group_10, scenarios: [management_summary], datasets: [credit_portfolio]}
