# Items that local macOS validation cannot prove. Each stays `pending` until the evidence below is recorded from
# the CAI sandbox (L40S) or the BNI environment (H200). Do not change a status without that evidence.
schema_version: 1
items:
  - id: gpu-dependency-matrix
    status: cai-validation-pending
    covers: [gpu-l40s, gpu-h200]
    intended: {vllm: "0.29.0", torch: "2.13.0", transformers: ">=5.10.4", cuda_wheel_family: cu13}
    intended_source: vllm 0.29.0 package metadata on PyPI (not observed)
    evidence_needed: Lab 00 output in each PBJ NVIDIA GPU runtime, then the frozen lock file
    validated_in: [sandbox-l40s, bni-h200]
  - id: cpu-only-torch-linux-rag
    status: cai-validation-pending
    covers: [rag]
    question: The PyPI Linux torch wheel pulls the CUDA runtime wheels (several GB). Decide whether Linux RAG sessions need a CPU-only torch wheel.
    evidence_needed: Install size, import time and bge-m3 CPU embedding time in a PBJ Standard session
    validated_in: [sandbox-l40s]
  - id: live-qdrant-server
    status: cai-validation-pending
    covers: [lab 07, deployments/cai/qdrant/app.py]
    verified_locally: qdrant-client local mode and the exact REST request body only
    evidence_needed: Lab 07 --mode cai against the shared Qdrant Application, ten group partitions, restart persistence
    validated_in: [sandbox-l40s, bni-h200]
  - id: vllm-qwen-model-loading
    status: cai-validation-pending
    covers: [deployments/cai/vllm/app.py, labs 01-03]
    evidence_needed: Qwen3.5-9B BF16 loaded from NFS with TP=1, /health, /v1/models, streaming and non-streaming chat, concurrency
    validated_in: [sandbox-l40s, bni-h200]
  - id: cai-api-v2-fields
    status: cai-validation-pending
    covers: [automation/cai_api_v2]
    verified_locally: dry-run plan only; no API call has been made
    evidence_needed: Comparison with the target /api/v2/swagger.html, runtime identifier from the target catalog, operator-approved live dry run
    validated_in: [sandbox-l40s, bni-h200]
  - id: live-impala-authentication
    status: cai-validation-pending
    covers: [impala_gssapi, impala_ldap]
    verified_locally: explicit-mode behavior and no silent CSV fallback, with an unreachable host
    evidence_needed: GSSAPI or LDAP login and the lab 05 query against the customer Impala
    validated_in: [bni-h200]
  - id: workshop-portal-capacity
    status: cai-validation-pending
    covers: [apps/workshop-portal, deployments/cai/workshop-portal, src/bni_training/workshop/portal]
    verified_locally: isolation tests, the 3-slot inference gate, and 40 concurrent in-process sessions with a mock LLM
    evidence_needed: About 40 real browsers on one 4 vCPU / 8-16 GB Application; queue and timeout behavior against the real shared vLLM or LiteLLM endpoint; whether CAI exposes the user identity
    validated_in: [sandbox-l40s, bni-h200]
  - id: portal-single-replica-enforcement
    status: cai-validation-pending
    covers: [config/workshop/applications.yaml, src/bni_training/workshop/portal/instance_guard.py]
    verified_locally: the single-instance guard refuses a second process or host while the first heartbeat is fresh
    evidence_needed: Confirm the CAI Application is created with one replica, that a restart does not leave two instances, and how the heartbeat file on the project filesystem behaves across pods
    validated_in: [sandbox-l40s, bni-h200]
  - id: dataset-in-cai-portal
    status: cai-validation-pending
    covers: [data/raw, src/bni_training/data/engine.py]
    verified_locally: 21/21 validator checks, ten missions, guarded read-only SQLite engine on a Mac
    evidence_needed: The Portal loads the 12 MB dataset in memory and answers all ten missions inside the CAI Application within its memory limit; data/raw is readable from the Application and Sessions
    validated_in: [sandbox-l40s, bni-h200]
  - id: group-workspaces-in-cai-sessions
    status: cai-validation-pending
    covers: [scripts/prepare_group_workspaces.py, scripts/validate_group_workspaces.py, workshop/runtime]
    verified_locally: generation, idempotency, preserved edits, reset and archive in a temporary directory; ten groups; no secrets in group.env
    evidence_needed: The hierarchy is created on the CAI project filesystem, ten Sessions open their own notebooks and write only to their own output folder, and the filesystem permits concurrent writes from ten Sessions
    validated_in: [sandbox-l40s, bni-h200]
  - id: notebook-labs-cai-mode
    status: cai-validation-pending
    covers: [notebooks/templates, scripts/03_llm_api_testing.py, scripts/12_end_to_end_portal.py, config/workshop/labs.yaml]
    verified_locally: all 13 templates execute through nbclient in --mode local; trainer-only labs refuse participants
    evidence_needed: Labs 00 and 03-12 with --mode cai from a participant Session against the live shared vLLM, Qdrant, Phoenix, LiteLLM and Portal; labs 01 and 02 run by a trainer against the NFS model
    validated_in: [sandbox-l40s, bni-h200]
  - id: shared-service-health-checks-live
    status: cai-validation-pending
    covers: [scripts/check_shared_services.py, config/workshop/application-lifecycle.yaml]
    verified_locally: PASS, FAIL and SKIPPED handling against local stub servers and unreachable hosts
    evidence_needed: The checks reach the real Application URLs from a participant Session for each lifecycle phase
    validated_in: [sandbox-l40s, bni-h200]
  - id: participant-assignment-roster
    status: cai-validation-pending
    covers: [scripts/assign_participants.py]
    verified_locally: 40 synthetic participants over ten groups, capacity of five per group, roster errors
    evidence_needed: The trainer's real roster format and how participants are told their group
    validated_in: [bni-h200]
