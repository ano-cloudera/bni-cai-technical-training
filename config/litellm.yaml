model_list:
  - model_name: qwen-primary
    litellm_params:
      model: openai/qwen3.5-9b
      api_base: os.environ/VLLM_BASE_URL
      api_key: os.environ/VLLM_API_KEY
      # Qwen3.5 thinking text would fill the token budget; verified that the gateway injects this into every request.
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  - model_name: training-fallback
    litellm_params:
      # The upstream model name must be one the endpoint serves. With the vLLM URL this is qwen3.5-9b; a stand-in
      # server (apps/litellm/mock_fallback.py) answers to any name.
      model: openai/qwen3.5-9b
      api_base: os.environ/MOCK_FALLBACK_BASE_URL
      api_key: workshop-only
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 60
litellm_settings:
  drop_params: true
  request_timeout: 60

