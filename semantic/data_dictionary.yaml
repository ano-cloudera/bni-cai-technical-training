# Data dictionary of the fully synthetic workshop banking dataset (data/raw/*.csv).
# One physical copy serves all ten group missions; groups see logical bundles of it (data/scenarios).
# No names, addresses, phone numbers, identity numbers or other personal data exist in any column.
schema_version: 1
dataset: synthetic_banking_workshop
currency_note: Amounts are in one unspecified synthetic currency unit. They are not real money.
reference_date: "2026-06-30"
tables:
  branches:
    description: A synthetic bank branch.
    primary_key: branch_id
    columns:
      branch_id: {description: Unique branch identifier., type: text, role: primary_key, sensitivity: synthetic_identifier, pattern: '^SYN-BR-\d{5}$', examples: [SYN-BR-00001]}
      branch_name: {description: Fictional branch name., type: text, role: attribute, sensitivity: synthetic_attribute, pattern: '^[A-Z][a-z]+ [A-Z][a-z]+ Branch$', examples: [Alder Bay Branch]}
      region: {description: Operating region of the branch., type: text, role: attribute, sensitivity: synthetic_attribute, allowed_values: [North, South, East, West, Central, Islands]}
      province: {description: Fictional province inside the region., type: text, role: attribute, sensitivity: synthetic_attribute, pattern: '^(North|South|East|West|Central|Islands) Province [1-3]$'}
      city: {description: Fictional city of the branch., type: text, role: attribute, sensitivity: synthetic_attribute, pattern: '^[A-Z][a-z]+ [A-Z][a-z]+$'}
      city_tier: {description: Size tier of the city (TIER_1 is the largest)., type: text, role: attribute, sensitivity: synthetic_attribute, allowed_values: [TIER_1, TIER_2, TIER_3]}
      size_class: {description: Branch size class., type: text, role: attribute, sensitivity: synthetic_attribute, allowed_values: [SMALL, MEDIUM, LARGE]}
      open_date: {description: Date the branch opened., type: date, role: attribute, sensitivity: synthetic_attribute}
      operational_status: {description: Whether the branch is operating., type: text, role: attribute, sensitivity: synthetic_attribute, allowed_values: [ACTIVE, RENOVATION, CLOSED]}
  customers:
    description: A synthetic customer. Contains banded attributes only, never identifying details.
    primary_key: customer_id
    columns:
      customer_id: {description: Unique customer identifier., type: text, role: primary_key, sensitivity: synthetic_identifier, pattern: '^SYN-CUST-\d{5}$', examples: [SYN-CUST-00001]}
      home_branch_id: {description: The branch the customer mainly uses., type: text, role: foreign_key, references: branches.branch_id, sensitivity: synthetic_identifier, pattern: '^SYN-BR-\d{5}$'}
      segment: {description: Commercial customer segment., type: text, role: attribute, sensitivity: synthetic_attribute, allowed_values: [RETAIL, AFFLUENT, SME, CORPORATE, STUDENT]}
      region: {description: Region of the home branch., type: text, role: attribute, sensitivity: synthetic_attribute, allowed_values: [North, South, East, West, Central, Islands]}
      age_band: {description: Age range of the customer., type: text, role: attribute, sensitivity: synthetic_attribute, allowed_values: ["18-24", "25-34", "35-44", "45-54", "55-64", "65+"]}
      income_band: {description: Income range of the customer., type: text, role: attribute, sensitivity: synthetic_attribute, allowed_values: [LOW, LOWER_MIDDLE, MIDDLE, UPPER_MIDDLE, HIGH]}
      occupation_category: {description: Broad occupation group., type: text, role: attribute, sensitivity: synthetic_attribute, allowed_values: [EMPLOYEE_PRIVATE, EMPLOYEE_PUBLIC, SELF_EMPLOYED, BUSINESS_OWNER, PROFESSIONAL, STUDENT, RETIRED, HOMEMAKER, OTHER]}
      join_date: {description: Date the customer joined the bank., type: date, role: attribute, sensitivity: synthetic_attribute}
      customer_status: {description: Lifecycle status of the customer., type: text, role: attribute, sensitivity: synthetic_attribute, allowed_values: [ACTIVE, INACTIVE, CLOSED]}
      digital_adoption_level: {description: How much the customer uses digital channels., type: text, role: attribute, sensitivity: synthetic_attribute, allowed_values: [NONE, LOW, MEDIUM, HIGH]}
  accounts:
    description: A synthetic deposit or business account owned by one customer.
    primary_key: account_id
    columns:
      account_id: {description: Unique account identifier., type: text, role: primary_key, sensitivity: synthetic_identifier, pattern: '^SYN-ACC-\d{5}$', examples: [SYN-ACC-00001]}
      customer_id: {description: Owner of the account., type: text, role: foreign_key, references: customers.customer_id, sensitivity: synthetic_identifier, pattern: '^SYN-CUST-\d{5}$'}
      branch_id: {description: Branch that holds the account., type: text, role: foreign_key, references: branches.branch_id, sensitivity: synthetic_identifier, pattern: '^SYN-BR-\d{5}$'}
      product_code: {description: Account product., type: text, role: attribute, sensitivity: synthetic_attribute, allowed_values: [SAV-BASIC, SAV-PLUS, CHK-STD, CHK-PRM, TD-FIXED, PAYROLL, SME-OPER, STUDENT-SAV]}
      account_type: {description: Account family of the product., type: text, role: attribute, sensitivity: synthetic_attribute, allowed_values: [SAVINGS, CHECKING, TIME_DEPOSIT, PAYROLL, BUSINESS]}
      open_date: {description: Date the account was opened., type: date, role: attribute, sensitivity: synthetic_attribute}
      account_status: {description: ACTIVE has activity in the last 180 days; DORMANT has none for more than 180 days; CLOSED is closed., type: text, role: attribute, sensitivity: synthetic_attribute, allowed_values: [ACTIVE, DORMANT, CLOSED]}
      balance: {description: Balance at the reference date; zero when closed., type: real, role: measure, sensitivity: synthetic_amount, min: 0}
      average_monthly_balance: {description: Average month-end balance over the last months., type: real, role: measure, sensitivity: synthetic_amount, min: 0}
      last_activity_date: {description: Date of the latest transaction, or the open date when there is none., type: date, role: attribute, sensitivity: synthetic_attribute}
      channel_preference: {description: Channel the customer prefers for this account., type: text, role: attribute, sensitivity: synthetic_attribute, allowed_values: [BRANCH, MOBILE, ONLINE, ATM]}
  transactions:
    description: A synthetic account transaction over about 24 months.
    primary_key: transaction_id
    columns:
      transaction_id: {description: Unique transaction identifier., type: text, role: primary_key, sensitivity: synthetic_identifier, pattern: '^SYN-TXN-\d{6}$', examples: [SYN-TXN-000001]}
      account_id: {description: Account the transaction belongs to., type: text, role: foreign_key, references: accounts.account_id, sensitivity: synthetic_identifier, pattern: '^SYN-ACC-\d{5}$'}
      transaction_date: {description: Date of the transaction., type: date, role: attribute, sensitivity: synthetic_attribute}
      transaction_type: {description: Kind of transaction., type: text, role: attribute, sensitivity: synthetic_attribute, allowed_values: [DEPOSIT, WITHDRAWAL, TRANSFER_IN, TRANSFER_OUT, PAYMENT, CARD_PURCHASE, FEE, INTEREST, SALARY]}
      channel: {description: Channel used. MOBILE and ONLINE are digital., type: text, role: attribute, sensitivity: synthetic_attribute, allowed_values: [BRANCH, ATM, MOBILE, ONLINE, CARD_POS, SYSTEM]}
      amount: {description: Transaction amount, always positive; the type gives the direction., type: real, role: measure, sensitivity: synthetic_amount, min: 0}
      merchant_category: {description: Merchant group for card purchases and payments; NONE otherwise., type: text, role: attribute, sensitivity: synthetic_attribute, allowed_values: [GROCERY, FUEL, DINING, RETAIL, UTILITIES, TRAVEL, HEALTHCARE, EDUCATION, ENTERTAINMENT, NONE]}
      transaction_status: {description: Processing status., type: text, role: attribute, sensitivity: synthetic_attribute, allowed_values: [COMPLETED, PENDING, FAILED, REVERSED]}
  loans:
    description: A synthetic loan. Descriptive data only; no approval, rejection or scoring exists anywhere.
    primary_key: loan_id
    columns:
      loan_id: {description: Unique loan identifier., type: text, role: primary_key, sensitivity: synthetic_identifier, pattern: '^SYN-LOAN-\d{5}$', examples: [SYN-LOAN-00001]}
      customer_id: {description: Borrower., type: text, role: foreign_key, references: customers.customer_id, sensitivity: synthetic_identifier, pattern: '^SYN-CUST-\d{5}$'}
      account_id: {description: Account linked to the loan., type: text, role: foreign_key, references: accounts.account_id, sensitivity: synthetic_identifier, pattern: '^SYN-ACC-\d{5}$'}
      branch_id: {description: Branch that booked the loan (the linked account's branch)., type: text, role: foreign_key, references: branches.branch_id, sensitivity: synthetic_identifier, pattern: '^SYN-BR-\d{5}$'}
      product_code: {description: Loan product., type: text, role: attribute, sensitivity: synthetic_attribute, allowed_values: [LOAN-PERSONAL, LOAN-AUTO, LOAN-HOME, LOAN-SME, LOAN-EDU]}
      origination_date: {description: Date the loan started., type: date, role: attribute, sensitivity: synthetic_attribute}
      maturity_date: {description: Contractual end date., type: date, role: attribute, sensitivity: synthetic_attribute}
      principal_amount: {description: Original amount., type: real, role: measure, sensitivity: synthetic_amount, min: 0}
      outstanding_amount: {description: Remaining amount at the reference date; never above the principal., type: real, role: measure, sensitivity: synthetic_amount, min: 0}
      days_past_due: {description: Days the oldest payment is overdue at the reference date., type: integer, role: measure, sensitivity: synthetic_attribute, min: 0}
      loan_status: {description: Descriptive status derived from days past due., type: text, role: attribute, sensitivity: synthetic_attribute, allowed_values: [CURRENT, GRACE, DELINQUENT, DEFAULTED, PAID_OFF]}
      risk_band: {description: Descriptive label derived from days past due and product. Not a score and not used for decisions., type: text, role: attribute, sensitivity: synthetic_attribute, allowed_values: [LOW, MEDIUM, HIGH]}
