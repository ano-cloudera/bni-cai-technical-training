# Trainer-only demo: run the LiteLLM gateway with a Postgres database on a laptop so its Admin UI can be shown
# (models, keys, settings). Participants never use this: Lab 10 calls the LiteLLM Application in CAI.
# The gateway reads the repository's config/litellm.yaml unchanged. No secret is stored in this file.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: litellm
    volumes:
      - litellm-demo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:main-stable}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ../../../config/litellm.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
      VLLM_BASE_URL: ${VLLM_BASE_URL:?set VLLM_BASE_URL in .env}
      VLLM_API_KEY: ${VLLM_API_KEY:-EMPTY}
      MOCK_FALLBACK_BASE_URL: ${MOCK_FALLBACK_BASE_URL:-${VLLM_BASE_URL}}

volumes:
  litellm-demo-db:
