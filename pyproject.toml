[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bni-cai-technical-training"
version = "0.1.0"
description = "Synthetic Credit Portfolio Insight workshop for Cloudera AI"
requires-python = ">=3.10,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires configured Cloudera AI services"]
filterwarnings = [
    "ignore::DeprecationWarning:authlib.*",
    "ignore:.*authlib.*:Warning",
]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_notebooks.py" = ["E501"]
# Probability tables read best as one line per entry.
"src/bni_training/data/synthetic.py" = ["E501"]
# Lab scripts are teaching code: one check per line reads better than wrapped report calls.
"scripts/[0-1][0-9]_*.py" = ["E501"]

